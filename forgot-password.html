<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f9fc;
    }
    .auth-container {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-container h1 {
      margin-bottom: 24px;
      color: #333;
    }
    .auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .auth-container button {
      width: 100%;
    }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      display: none;
    }
    .message.success { background-color: #e6f9f0; color: #008a4c; }
    .message.error { background-color: #fdecea; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1>Forgot Password</h1>
    <p style="margin-bottom: 24px; color: #666;">Enter your admin email to receive a password reset link.</p>
    <form id="forgotPasswordForm">
      <input type="email" id="email" placeholder="Email Address" required>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.display = 'none';

      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value }),
      });

      const data = await res.json();
      messageDiv.textContent = data.message || data.error;
      messageDiv.className = `message ${res.ok ? 'success' : 'error'}`;
      messageDiv.style.display = 'block';
    });
  </script>

</body>
</html>
