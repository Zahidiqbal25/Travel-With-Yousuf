<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f9fc;
    }
    .auth-container {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-container h1 {
      margin-bottom: 24px;
      color: #333;
    }
    .auth-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .auth-container button {
      width: 100%;
    }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      display: none;
    }
    .message.success { background-color: #e6f9f0; color: #008a4c; }
    .message.error { background-color: #fdecea; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1>Reset Your Password</h1>
    <form id="resetPasswordForm">
      <input type="password" id="password" placeholder="New Password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
      <button type="submit" class="btn">Reset Password</button>
    </form>
    <div id="message" class="message"></div>
    <a id="loginLink" href="/login.html" style="display:none; margin-top: 16px; display: inline-block;">Go to Login</a>
  </div>

  <script>
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const messageDiv = document.getElementById('message');
    const loginLink = document.getElementById('loginLink');

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      messageDiv.textContent = 'Invalid or missing password reset token.';
      messageDiv.className = 'message error';
      messageDiv.style.display = 'block';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.display = 'none';

      if (passwordInput.value !== confirmPasswordInput.value) {
        messageDiv.textContent = 'Passwords do not match.';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
        return;
      }

      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: passwordInput.value }),
      });

      const data = await res.json();
      messageDiv.textContent = data.message || data.error;
      messageDiv.className = `message ${res.ok ? 'success' : 'error'}`;
      messageDiv.style.display = 'block';

      if (res.ok) {
        form.style.display = 'none';
        loginLink.style.display = 'inline-block';
      }
    });
  </script>

</body>
</html>
